apiVersion: v1
kind: ConfigMap
metadata:
  name: yubi-backend-config
data:
  RP_ID: "localhost"
  RP_ORIGIN: "http://localhost:3000"
  RUST_LOG: "info"
  PORT: "8080"
  MAX_DB_CONNECTIONS: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: yubi-backend-secret
type: Opaque
stringData:
  DATABASE_URL: "postgres://yubi_app:app_secret@yubi-pg-rw:5432/yubi"
  COOKIE_SECRET: "super-secret-64-byte-key-for-session-cookies-and-webauthn-state-encryption!!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yubi-backend
spec:
  selector:
    matchLabels:
      app: yubi-backend
  template:
    metadata:
      labels:
        app: yubi-backend
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z yubi-pg-rw 5432; do echo "Waiting for postgres..."; sleep 2; done;']
      containers:
      - name: backend
        image: localhost/yubi-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: yubi-backend-config
        - secretRef:
            name: yubi-backend-secret
---
apiVersion: v1
kind: Service
metadata:
  name: yubi-backend
spec:
  selector:
    app: yubi-backend
  ports:
  - port: 8080
    targetPort: 8080
