apiVersion: apps/v1
kind: Deployment
metadata:
  name: yubi-backend
spec:
  selector:
    matchLabels:
      app: yubi-backend
  template:
    metadata:
      labels:
        app: yubi-backend
    spec:
      containers:
      - name: backend
        image: yubi-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          value: "postgres://yubiuser@yubi-pg-rw:5432/yubi"
        - name: RUST_LOG
          value: "info"
---
apiVersion: v1
kind: Service
metadata:
  name: yubi-backend
spec:
  selector:
    app: yubi-backend
  ports:
  - port: 8080
    targetPort: 8080
