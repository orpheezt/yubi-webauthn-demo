apiVersion: batch/v1
kind: Job
metadata:
  name: yubi-migrations
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z yubi-pg-rw 5432; do echo "Waiting for postgres..."; sleep 2; done;']
      containers:
      - name: migrate
        image: localhost/yubi-migrations:latest
        imagePullPolicy: Never
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: yubi-pg-app
              key: uri
