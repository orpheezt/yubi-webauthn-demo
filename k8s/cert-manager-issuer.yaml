apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: yubi-root-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: yubi-local-cert
  namespace: yubi
spec:
  secretName: yubi-tls-secret
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  commonName: yubi.local
  dnsNames:
    - yubi.local
  issuerRef:
    name: yubi-root-issuer
    kind: ClusterIssuer
