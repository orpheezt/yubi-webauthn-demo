apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: yubi-pg
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: yubi
      owner: yubi_migrator
      postInitApplicationSQL:
        - "CREATE ROLE yubi_app WITH LOGIN PASSWORD 'app_secret';"
        - "GRANT CONNECT ON DATABASE yubi TO yubi_app;"
        - "GRANT USAGE ON SCHEMA public TO yubi_app;"
        - "ALTER DEFAULT PRIVILEGES FOR ROLE yubi_migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO yubi_app;"
        - "ALTER DEFAULT PRIVILEGES FOR ROLE yubi_migrator IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO yubi_app;"
        - "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO yubi_app;"
        - "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO yubi_app;"
