name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'backend/**'
      - 'migrations/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'backend/**'
      - 'migrations/**'
      - '.github/workflows/backend.yml'

jobs:
  backend-test:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-trixie
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: backend -> target

      - name: Install psql client & apply migrations
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for f in migrations/*.up.sql; do
            PGPASSWORD=secret psql -h localhost -U postgres -d postgres -f "$f"
          done

      - name: Cargo Check
        run: |
          cd backend
          DATABASE_URL="postgres://postgres:secret@localhost:5432/postgres" cargo check --locked

      - name: Cargo Clippy
        run: |
          cd backend
          DATABASE_URL="postgres://postgres:secret@localhost:5432/postgres" cargo clippy -- -D warnings

      - name: Cargo Test
        run: |
          cd backend
          DATABASE_URL="postgres://postgres:secret@localhost:5432/postgres" cargo test

  container-build:
    name: Backend Container Image Build Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-trixie
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Buildah
        run: sudo apt-get update && sudo apt-get install -y buildah

      - name: Install psql client & apply migrations
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for f in migrations/*.up.sql; do
            PGPASSWORD=secret psql -h localhost -U postgres -d postgres -f "$f"
          done

      - name: Build Backend Image
        run: sudo buildah bud --network=host --build-arg DATABASE_URL="postgres://postgres:secret@127.0.0.1:5432/postgres" -t yubi-backend:latest -f backend/Containerfile backend/
