name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Lint frontend (Oxlint)
        run: |
          cd frontend
          bun run lint --format=github

      - name: Typecheck frontend (TypeScript)
        run: |
          cd frontend
          bun run typecheck

      - name: Build frontend
        run: |
          cd frontend
          bun run build

  container-build:
    name: Frontend Container Image Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Buildah
        run: sudo apt-get update && sudo apt-get install -y buildah

      - name: Build Frontend Image
        run: sudo buildah bud -t yubi-frontend:latest -f frontend/Containerfile frontend/
